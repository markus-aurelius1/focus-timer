name: Verify Atlas News architecture
# verification revision 4

on:
  push:
    branches: [codex/atlas-news-architecture]
    paths:
      - .github/workflows/atlas-news-architecture-verify.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/atlas-news-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/atlas-build/package-lock.json
            tools/perf/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tools/atlas-build
      - run: npm ci --prefix tools/perf
      - run: cd tools/perf && npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node --test tools/atlas-build/test/*.test.mjs
      - run: npm run build
      - name: Production browser gates
        run: |
          set -euo pipefail
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/tars-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; wait "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/tars-preview.log; exit 1; fi
          node tools/perf/maplibre-atlas-check.mjs http://127.0.0.1:4173/
          node tools/perf/smoke.mjs http://127.0.0.1:4173/
          node tools/perf/current-affairs-check.mjs http://127.0.0.1:4173/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-news-architecture-verification
          path: tools/perf/out/
